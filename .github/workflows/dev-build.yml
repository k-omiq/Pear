name: Dev build

# Unstable installers for hand testing. Deliberately NOT the release path:
# nothing here writes latest.json or touches the R2 bucket, so an installed
# app is never offered one of these builds by the in-app updater.
#
# Trigger: run manually with workflow_dispatch, or push a tag like
# v0.2.1-dev.1. The GitHub release it makes is always marked prerelease.
#
# Updater artifacts are switched off through --config, which also means the
# build needs no signing key.

on:
  push:
    tags: ["v*-dev*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag for the prerelease (e.g. v0.2.1-dev.1)"
        required: false
        default: ""
      notes:
        description: "Notes shown on the prerelease"
        required: false
        default: ""

# The x86_64 Linux lane links an ONNX Runtime built here without AVX
# ("ONNX Runtime without AVX" below), so the app runs on every x86-64 CPU.
# "off" would link pyke's prebuilt runtime instead, which needs AVX2: an
# emergency switch only, never a release setting.
env:
  ORT_BASELINE: "on"

concurrency:
  group: dev-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            platform: darwin-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
          # x86_64 carries WebGPU and falls back to CPU on GPU-less machines.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            features: gpu-webgpu
          # The ARM64 ONNX Runtime distribution is CPU-only.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            curl wget file patchelf desktop-file-utils
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          # Pinned: Rust 1.100 changed the build directory layout and breaks
          # ort-sys 2.0.0-rc.13's copy-dylibs (dynamic_link.rs). Raise it once
          # ort-sys is updated.
          toolchain: "1.99.1"
          targets: ${{ matrix.target }},wasm32-unknown-unknown
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: dev-${{ matrix.platform }}
      - run: npm ci
      - name: Build the text engine
        # text-engine/js/generated/mt_text.wasm is a build product, not in git.
        # Without it the app still builds but ships with no Rust text engine.
        run: npm run build:engine
      - name: ONNX Runtime without AVX
        # pyke's prebuilt x86_64 ONNX Runtime needs AVX2 and dies with SIGILL
        # at start-up on CPUs without it (Pentium Silver, Celeron, older
        # Atom). This lane links its own baseline build instead; see
        # scripts/ci/build-onnxruntime-baseline.sh.
        if: matrix.platform == 'linux-x86_64' && env.ORT_BASELINE == 'on'
        uses: ./.github/actions/onnxruntime-baseline
      - name: Build app
        # The overlay config switches createUpdaterArtifacts off: a dev build
        # must not be installable as an update, and without those artifacts
        # there is no signing key to supply. It is a file rather than an inline
        # JSON string because PowerShell strips the inner quotes on the Windows
        # runner and tauri then rejects the value.
        # Linux builds only the .deb; scripts/build-appimage.sh turns it into
        # the AppImage below (no bundled GTK/WebKit, see that script).
        run: npx tauri build --target ${{ matrix.target }} ${{ matrix.features && format('--features {0}', matrix.features) || '' }} --config src-tauri/tauri.dev-build.conf.json ${{ runner.os == 'Linux' && '--bundles deb' || '' }}
      - name: Check the app starts on a CPU without AVX
        # The whole executable this time, not just ONNX Runtime: our Rust and
        # every library it links, through all of their start-up code, which is
        # where the reported SIGILL was (protobuf's static initialisers).
        # qemu as Nehalem (SSE4.2, no AVX) raises SIGILL on any AVX
        # instruction, as the real chip does. `--probe-device none` is the
        # headless child mode with a provider name that registers nothing, so
        # the process loads, starts, prints an empty line and exits.
        #
        # qemu from Debian trixie, not the runner's: Ubuntu 24.04's qemu 8.2
        # crashes itself on Rust binaries (internal SIGSEGV reading
        # /proc/self/maps). The runner's root is the guest's library root;
        # Dawn comes from gpu-libs, where build.rs staged it.
        if: matrix.platform == 'linux-x86_64' && env.ORT_BASELINE == 'on'
        run: |
          docker run --rm -v /:/host:ro debian:trixie sh -c '
            set -e
            apt-get update -qq && apt-get install -y -qq qemu-user >/dev/null
            timeout 600 qemu-x86_64 -L /host -cpu Nehalem \
              -E LD_LIBRARY_PATH=${{ github.workspace }}/src-tauri/gpu-libs/lib \
              /host${{ github.workspace }}/src-tauri/target/${{ matrix.target }}/release/app --probe-device none'
      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          OUT="out/${{ matrix.platform }}"
          PREFIX="MangaTypesetter_${VERSION}-dev_${{ matrix.platform }}"
          mkdir -p "$OUT"
          case "${{ matrix.platform }}" in
            darwin-*)
              cp "$(ls "$BUNDLE"/dmg/*.dmg | head -1)" "$OUT/$PREFIX.dmg"
              ;;
            windows-*)
              cp "$(ls "$BUNDLE"/nsis/*-setup.exe | head -1)" "$OUT/$PREFIX-setup.exe"
              ;;
            linux-*)
              # No signing key in this workflow, so no .sig is written.
              DEB=$(ls "$BUNDLE"/deb/*.deb | head -1)
              scripts/build-appimage.sh "$DEB" "$OUT/$PREFIX.AppImage"
              cp "$DEB" "$OUT/$PREFIX.deb"
              ;;
          esac
          ls -la "$OUT"
      - uses: actions/upload-artifact@v4
        with:
          name: dev-${{ matrix.platform }}
          path: out/${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7

  prerelease:
    name: Publish prerelease
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create or update the prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ github.event.inputs.tag }}"
            [ -n "$TAG" ] || TAG="v$(node -p "require('./src-tauri/tauri.conf.json').version")-dev.${GITHUB_RUN_NUMBER}"
          fi
          NOTES="${{ github.event.inputs.notes }}"
          [ -n "$NOTES" ] || NOTES="Unstable dev build from ${GITHUB_SHA}. Not served by the in-app updater. Install by hand at your own risk."
          FILES=$(ls artifacts/*/*.dmg artifacts/*/*-setup.exe artifacts/*/*.AppImage artifacts/*/*.deb)
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$TAG (unstable)" \
              --notes "$NOTES" \
              --prerelease
          fi
          gh release upload "$TAG" $FILES --repo "$GITHUB_REPOSITORY" --clobber
          echo "== prerelease $TAG published, updater untouched =="
